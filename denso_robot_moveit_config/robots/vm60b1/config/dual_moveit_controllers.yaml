move_group:
  ros__parameters:
    moveit_simple_controller_manager:
      controller_names:
        - left/left_arm_controller
        - right/right_arm_controller

      left/left_arm_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: false
        joints:
          - left_joint_1
          - left_joint_2
          - left_joint_3
          - left_joint_4
          - left_joint_5
          - left_joint_6

      right/right_arm_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: false
        joints:
          - right_joint_1
          - right_joint_2
          - right_joint_3
          - right_joint_4
          - right_joint_5
          - right_joint_6
